protocol_version: 1

workflow:
  requested_outcome_default: delivered
  active_request_index: .design-sync/active-requests.yaml
  checkpoint_location: .design-sync/checkpoints
  event_location: .design-sync/events
  artifact_schema_version: 1.0.0-alpha.4
  normal_output: compact
  audit_output: on_request_or_failure

source_control:
  type: git
  repository: owner/repository
  base_ref: main

design_authoring:
  adapter: claude_design
  project_name: Example Product Design
  project_id: replace-with-confirmed-id
  retired_project_ids: []
  fingerprint_files:
    - Home.dc.html
    - IMPLEMENT-home.md
  root_patterns:
    - "*.dc.html"
  package_path: design-canon-package
  handoff:
    protocol: _handoff/PROTOCOL.md
    requests: _handoff/requests
    responses: _handoff/responses
    verification: _handoff/verification
    envelopes: _handoff/envelopes
    receipts: _handoff/receipts

implementation_reference:
  adapter: repository_snapshot
  location: docs/design-canon/route-canon
  integrity_manifest: docs/design-canon/route-canon/SHA256SUMS
  atomic_unit: whole_snapshot
  allow_partial_overlay: false

implementation:
  adapter: claude_code
  targets:
    - apps/web

delivery:
  adapter: pull_request
  target_environment: development
  requires_delivery_approval: true

verification:
  candidate:
    - path_set
    - bytes
    - sha256
    - unexpected_drift
    - companion_coherence
    - visual_review_summary
  implementation:
    adapter: live_browser
    checks:
      - reference_fidelity
      - accessibility
      - responsive_layout
  delivery:
    adapter: target_environment_recheck
  final_record:
    type: DVER
    location: _handoff/verification

ownership:
  design_authoring_source: design_authoring.root_patterns
  implementation_reference: implementation_reference.location
  implementation_targets: implementation.targets
  repository_managed_metadata:
    - implementation_reference.integrity_manifest

transport:
  soft_authoring_limit_bytes: 200000
  hard_transport_limit_bytes: 262144
  zip_fallback: true

state_storage:
  adapter: filesystem
  append_only_events: true
  retain_artifacts: true
  retention_days: null
  compaction:
    enabled: false
    requires_verified_snapshot: true
  privacy:
    persist_chat_transcripts: false
    persist_model_reasoning: false

updates:
  marketplace: tygwan-protocols
  plugin: claude-design-sync@tygwan-protocols
  require_durable_checkpoint: true
  reload_command: /reload-plugins
  resume_action: continue

integrations:
  ui_ux_pro_max:
    adapter: claude_plugin_skill
    plugin: ui-ux-pro-max@ui-ux-pro-max-skill
    mode: auto_if_available
    role: advisory
    evidence_grade: E2
    version_policy: pin_per_request
    permissions:
      read_only: true
      modify_project: false
      persist_design_system: false
      implement_code: false
      decide_policy: false
    activation:
      stages: [request_discovery, design_authoring, design_review]
      when_any:
        - new_visual_pattern
        - missing_project_canon
        - design_alternatives_requested
        - typography_or_color_decision
        - interaction_quality_question
        - responsive_or_accessibility_risk
        - explicit_user_request
      skip_when:
        - exact_canon_implementation
        - mechanical_css_fix
        - backend_or_api_only
        - established_token_application
        - regulated_policy_decision

gates:
  request_scope_approval:
    role: product_owner
    local_alias: G1
  design_acceptance:
    roles:
      - product_owner
      - design_reviewer
    local_alias: G2
  implementation_acceptance:
    role: product_owner
    local_alias: G3
  delivery_approval:
    role: product_owner
    local_alias: null
  regulated_decision:
    role: domain_decider
    local_alias: G4

surfaces:
  - implementation_target: apps/web
    route: /
    design_file: Home.dc.html

review:
  conformance_target: WCAG_2_2_AA
  viewports:
    - width: 390
      classification: required
    - width: 768
      classification: required
    - width: 1280
      classification: optional
  evidence_required_for_design_acceptance:
    - canonical_artifact
  evidence_required_for_implementation_acceptance:
    - live_render
  allowed_decisions:
    - approve
    - hold
    - unverified
    - not_applicable
